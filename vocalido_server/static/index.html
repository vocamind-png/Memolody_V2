    <script>
        // Force unregister any active service worker to prevent PWA caching issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(reg) {
                    reg.unregister().then(function(success) {
                        if (success) {
                            console.log('Old Service Worker successfully unregistered.');
                        }
                    });
                });
            });
        }
        // Force clear Cache Storage to purge old PWA assets (excluding model files)
        if ('caches' in window) {
            caches.keys().then(function(names) {
                names.forEach(function(name) {
                    if (name.indexOf('vocalido-models') === -1) {
                        caches.delete(name).then(function(success) {
                            if (success) {
                                console.log('Cache Storage cleared:', name);
                            }
                        });
                    }
                });
            });
        }
    </script>

        .page-container {

            margin-bottom: 2rem;

            aspect-ratio: 210 / 297; /* Force A4 aspect ratio */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-radius: 4px;
        }

        .page-container svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
            image-rendering: geometricPrecision;
        }

        .neural-playback-laser {
          position: absolute;
          width: 2px;
          background: linear-gradient(to bottom, transparent, rgba(0, 229, 255, 0.8), rgba(99, 102, 241, 0.8), transparent);
          z-index: 5000;
          pointer-events: none;
          will-change: left, opacity;
          box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
          transition: opacity 0.3s ease;
        }

        .neural-playback-laser::before {
          content: '';
          position: absolute;
          top: 50%;
          left: 50%;
          width: 12px;
          height: 12px;
          background: #fff;
          border-radius: 50%;
          transform: translate(-50%, -50%);
          box-shadow: 
            0 0 20px 5px #00e5ff,
            0 0 40px 10px #6366f1,
            inset 0 0 10px #fff;
        }

        .neural-playback-laser::after {
          content: '';
          position: absolute;
          top: 50%;
          right: 50%;
          width: 150px;
          height: 20px;
          transform: translateY(-50%);
          background-image: 
            radial-gradient(circle, #fff 1px, transparent 1px),
            radial-gradient(circle, #00e5ff 1.5px, transparent 1.5px);
          background-size: 20px 10px, 15px 15px;
          background-position: 0 0, 5px 5px;
          opacity: 0.8;
          filter: blur(0.5px);
          animation: sparkle-tail 0.5s linear infinite;
          mask-image: linear-gradient(to left, black, transparent);
          -webkit-mask-image: linear-gradient(to left, black, transparent);
          pointer-events: none;
        }

        @keyframes sparkle-tail {
          0% { background-position: 0 0, 5px 5px; }
          100% { background-position: -20px 0, -10px 5px; }
        }

        @media (min-width: 640px) {
            .page-container {
                width: 794px; /* Standard A4 size on tablets/desktop */
            }
        }

        @media print {
            @page { margin: 0 !important; size: A4 portrait !important; }
            .no-print { display: none !important; }
            .page-container { margin: 0 !important; display: block !important; width: 210mm !important; height: 297mm !important; }
