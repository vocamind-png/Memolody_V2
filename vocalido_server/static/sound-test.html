<!DOCTYPE html>
<html><head><title>Lyrics Singing Test</title></head>
<body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:40px;">
<h1>🎤 Vocalido Lyrics Singing Test</h1>

<div style="margin:20px;">
  <button onclick="testDoReMi()" style="font-size:22px;padding:16px 40px;cursor:pointer;background:#10b981;color:#fff;border:none;border-radius:12px;margin:8px;">
    🎵 Do Re Mi Fa Sol
  </button>
  <button onclick="testThai()" style="font-size:22px;padding:16px 40px;cursor:pointer;background:#7c3aed;color:#fff;border:none;border-radius:12px;margin:8px;">
    🇹🇭 ภาษาไทย: ดอ เร มี
  </button>
  <button onclick="testSampler()" style="font-size:22px;padding:16px 40px;cursor:pointer;background:#0ea5e9;color:#fff;border:none;border-radius:12px;margin:8px;">
    🔊 Sampler (No Lyrics)
  </button>
</div>

<audio id="audioEl" controls style="margin:20px;width:500px;"></audio>
<p id="status" style="font-size:16px;min-height:24px;">Click a button to test</p>

<script>
async function synthesize(notes, label) {
  document.getElementById('status').textContent = `⏳ Rendering "${label}"...`;
  try {
    const resp = await fetch('/studio/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ notes, params: { bpm: 120 } })
    });
    const data = await resp.json();
    if (data.audio_b64) {
      const audio = document.getElementById('audioEl');
      audio.src = 'data:audio/wav;base64,' + data.audio_b64;
      audio.play();
      document.getElementById('status').textContent = 
        `✅ Playing "${label}" — Engine: ${data.engine}, Duration: ${data.duration?.toFixed(1)}s`;
    } else {
      document.getElementById('status').textContent = `❌ ${JSON.stringify(data)}`;
    }
  } catch(e) {
    document.getElementById('status').textContent = `❌ ${e.message}`;
  }
}

function testDoReMi() {
  synthesize([
    { pitch: 60, duration: 1, startTime: 0, lyric: 'Do' },
    { pitch: 62, duration: 1, startTime: 1, lyric: 'Re' },
    { pitch: 64, duration: 1, startTime: 2, lyric: 'Mi' },
    { pitch: 65, duration: 1, startTime: 3, lyric: 'Fa' },
    { pitch: 67, duration: 1, startTime: 4, lyric: 'Sol' },
  ], 'Do Re Mi Fa Sol');
}

function testThai() {
  synthesize([
    { pitch: 60, duration: 1, startTime: 0, lyric: 'ดอ' },
    { pitch: 62, duration: 1, startTime: 1, lyric: 'เร' },
    { pitch: 64, duration: 1, startTime: 2, lyric: 'มี' },
    { pitch: 65, duration: 1, startTime: 3, lyric: 'ฟา' },
    { pitch: 67, duration: 1, startTime: 4, lyric: 'ซอล' },
  ], 'ดอ เร มี ฟา ซอล');
}

function testSampler() {
  synthesize([
    { pitch: 60, duration: 1, startTime: 0 },
    { pitch: 64, duration: 1, startTime: 1 },
    { pitch: 67, duration: 1, startTime: 2 },
  ], 'Sampler C-E-G');
}
</script>
</body>
</html>
