# ============================================================
# DiffSinger Training Config: Nico (Vocos Vocoder)
# GPU: NVIDIA RTX 4000 Ada Generation (20GB VRAM)
# ============================================================

base_config:
  - configs/acoustic.yaml

# --- Model Identity ---
exp_name: nico_vocos_v1
speaker_id: nico

# --- Audio Settings ---
audio_sample_rate: 44100
hop_size: 512
win_size: 2048
fft_size: 2048
num_mels: 128
mel_fmin: 40
mel_fmax: 16000
f0_min: 65.0
f0_max: 1047.0

# --- Vocoder ---
vocoder: vocos
vocoder_ckpt: /workspace/diffsinger_training/vocos/checkpoints/vocos_44khz.ckpt
val_with_vocoder: false

# --- Dataset ---
binary_data_dir: /workspace/diffsinger_training/dataset/nico_sliced/binary
test_prefixes:
  - 17_British_Scale_Key_62
  - 43_Tech_Legato
  - 57_Dyn_Belting
dictionaries:
  en: dictionaries/english.txt
datasets:
  - raw_data_dir: /workspace/diffsinger_training/dataset/nico_sliced/raw
    speaker: nico
    language: en
    test_prefixes: [
      '17_British_Scale_Key_62',
      '43_Tech_Legato',
      '57_Dyn_Belting'
    ]
    spk_id: 0
mfa_model: english_us_arpa

# --- Architecture ---
hidden_size: 256
enc_layers: 4
dec_layers: 4
num_heads: 2
diffusion_type: reflow
timesteps: 1000
K_step: 1000
diff_decoder_type: wavenet

# --- Finetuning from Base Model ---
finetune_enabled: True
finetune_ckpt_path: /workspace/diffsinger_training/DiffSinger/checkpoints/base_model/base_model.ckpt
finetune_strict_shapes: False
finetune_ignored_params:
  - model.fs2.encoder.embed_tokens
  - model.fs2.txt_embed
  - model.fs2.spk_embed

# --- Training (RTX 4000 Ada) ---
max_batch_frames: 1500
max_batch_size: 2
max_updates: 160000
val_check_interval: 2000
optimizer: adamw
lr: 4.0e-4
scheduler: cosine
warmup_updates: 2000
weight_decay: 0.01

# --- Mixed Precision ---
pl_trainer_precision: "16-mixed"
pl_trainer_devices: 1
pl_trainer_accelerator: gpu

# --- Multi-Speaker (Nico + Lotte V) ---
use_spk_id: true
speakers:
  - nico
  - lotte_v
num_spk: 2
num_lang: 1

# --- Features ---
use_breathiness_embed: false
use_energy_embed: false
use_tension_embed: false
use_voicing_embed: false
use_key_shift_embed: true
hnsep: world

# --- Preprocessing ---
use_mfa: false
pe: parselmouth
# pe_ckpt: /workspace/diffsinger_training/rmvpe/model.pt

# --- Augmentation ---
augmentation_args:
  random_pitch_shifting:
    enabled: true
    range: [-2, 2]
    scale: 0.75
  random_time_stretching:
    enabled: false

# --- Checkpoints ---
permanent_ckpt_start: 120000
permanent_ckpt_interval: 20000
binarizer_cls: preprocessing.acoustic_binarizer.AcousticBinarizer
task_cls: training.acoustic_task.AcousticTask
