<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
    <title>Memolody — Play by Ear, Hear by Eye</title>
    <!-- Tailwind classes are handled by Vite build, no CDN needed -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="manifest" href="/manifest.json">
    <script>
        // In-App Browser Auto-Redirect
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isLine = (ua.indexOf("Line/") > -1);
            var isFB = (ua.indexOf("FBAV") > -1) || (ua.indexOf("FBAN") > -1);
            var isIG = (ua.indexOf("Instagram") > -1);
            
            if (isLine || isFB || isIG) {
                var isAndroid = /android/i.test(ua);
                var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                var currentUrl = window.location.href;
                
                if (isIOS && isLine) {
                    if (currentUrl.indexOf('openExternalBrowser=1') === -1) {
                        var sep = currentUrl.indexOf('?') === -1 ? '?' : '&';
                        window.location.replace(currentUrl + sep + 'openExternalBrowser=1');
                    }
                } else if (isAndroid) {
                    var cleanUrl = currentUrl.replace(/^https?:\/\//i, '');
                    window.location.replace('intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end');
                }
            }
        })();
    </script>
    <script>
        // Force unregister any active service worker to prevent PWA caching issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(reg) {
                    reg.unregister().then(function(success) {
                        if (success) {
                            console.log('Old Service Worker successfully unregistered.');
                        }
                    });
                });
            });
        }
        // Force clear Cache Storage to purge old PWA assets (excluding model files)
        if ('caches' in window) {
            caches.keys().then(function(names) {
                names.forEach(function(name) {
                    if (name.indexOf('vocalido-models') === -1) {
                        caches.delete(name).then(function(success) {
                            if (success) {
                                console.log('Cache Storage cleared:', name);
                            }
                        });
                    }
                });
            });
        }
        // Auto-reload when lazy-loaded chunks fail (stale cache after deploy)
        window.addEventListener('error', function(e) {
            if (e.message && (e.message.indexOf('Failed to fetch dynamically imported module') !== -1 || 
                              e.message.indexOf('Loading chunk') !== -1 ||
                              e.message.indexOf('Loading CSS chunk') !== -1)) {
                var reloaded = sessionStorage.getItem('chunk_reload');
                if (!reloaded) {
                    sessionStorage.setItem('chunk_reload', '1');
                    console.warn('[App] Stale chunk detected, auto-reloading...');
                    window.location.reload();
                }
            }
        });
        // Clear the reload flag on successful load
        sessionStorage.removeItem('chunk_reload');
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050507">
    <style>
        :root {
            --nimo-cyan: #00e5ff;
            --nimo-cyan-aura: rgba(0, 229, 255, 0.4);
            --nimo-amber: #ffab00;
            --nimo-amber-aura: rgba(255, 171, 0, 0.4);
            --nimo-indigo: #6366f1;
            --bg-dark: #050507;
            --grid-beat-line: rgba(255, 255, 255, 0.03);
            --grid-bar-line: rgba(255, 255, 255, 0.08);
        }
        
        html, body, #root { 
            height: 100dvh; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Default background — will be overridden by theme classes in index.css */
        body { background: #050507; }
        body.theme-v1 { background: #0A0A0B !important; background-image: none !important; }
        body.theme-v2 { 
            background-color: #030305 !important; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.06), transparent 30%) !important;
        }
        
        #root {
            max-width: 100vw; 
            margin: 0 auto;
            width: 100%;
            position: relative;
            background: transparent;
        }

        /* Compact Layout (default) — centered narrow column on desktop */
        @media (min-width: 1024px) {
            #root.layout-compact {
                max-width: 900px;
                border-left: 1px solid rgba(255,255,255,0.05);
                border-right: 1px solid rgba(255,255,255,0.05);
            }
        }

        /* Full Desktop Layout — use entire screen width */
        @media (min-width: 1024px) {
            #root.layout-full {
                max-width: 100vw;
                border-left: none;
                border-right: none;
                padding: 0 1rem;
            }
        }
        
        body { 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .lcd-font { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .unselectable { -webkit-user-select: none; user-select: none; }

        /* HIDE VEROVIO INTERNAL TITLES */
        .page-container svg g.pgHead text,
        .page-container svg g.title text,
        .page-container svg g.composer text {
            display: none !important;
        }

        /* RESPONSIVE A4 CONTAINER */
        .page-container {
            transition: box-shadow 0.3s ease;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            margin-bottom: 2rem;
            background: white;
            color: black;
            width: 92vw; /* Use most of the screen width on mobile */
            max-width: 794px; /* Fixed A4 max width for desktop */
            aspect-ratio: 210 / 297; /* Force A4 aspect ratio */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-radius: 4px;
        }

        .page-container svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
            image-rendering: geometricPrecision;
        }

        .neural-playback-laser {
          position: absolute;
          width: 2px;
          background: linear-gradient(to bottom, transparent, rgba(0, 229, 255, 0.8), rgba(99, 102, 241, 0.8), transparent);
          z-index: 5000;
          pointer-events: none;
          will-change: left, opacity;
          box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
          transition: opacity 0.3s ease;
        }

        .neural-playback-laser::before {
          content: '';
          position: absolute;
          top: 50%;
          left: 50%;
          width: 12px;
          height: 12px;
          background: #fff;
          border-radius: 50%;
          transform: translate(-50%, -50%);
          box-shadow: 
            0 0 20px 5px #00e5ff,
            0 0 40px 10px #6366f1,
            inset 0 0 10px #fff;
        }

        .neural-playback-laser::after {
          content: '';
          position: absolute;
          top: 50%;
          right: 50%;
          width: 150px;
          height: 20px;
          transform: translateY(-50%);
          background-image: 
            radial-gradient(circle, #fff 1px, transparent 1px),
            radial-gradient(circle, #00e5ff 1.5px, transparent 1.5px);
          background-size: 20px 10px, 15px 15px;
          background-position: 0 0, 5px 5px;
          opacity: 0.8;
          filter: blur(0.5px);
          animation: sparkle-tail 0.5s linear infinite;
          mask-image: linear-gradient(to left, black, transparent);
          -webkit-mask-image: linear-gradient(to left, black, transparent);
          pointer-events: none;
        }

        @keyframes sparkle-tail {
          0% { background-position: 0 0, 5px 5px; }
          100% { background-position: -20px 0, -10px 5px; }
        }

        @media (min-width: 640px) {
            .page-container {
                width: 794px; /* Standard A4 size on tablets/desktop */
            }
        }

        @media print {
            @page { margin: 0 !important; size: A4 portrait !important; }
            .no-print { display: none !important; }
            .page-container { margin: 0 !important; display: block !important; width: 210mm !important; height: 297mm !important; }
        }
    </style>
    <!-- Import map removed: Vite bundles all dependencies at build time -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="unselectable">
    <!-- NATIVE SPLASH SCREEN (Shows instantly before React loads) -->
    <div id="native-splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#050507;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s ease-out, visibility 0.6s ease-out;">
        <div style="position:relative;width:80px;height:80px;margin-bottom:24px;">
            <!-- Outer Glow ring -->
            <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0, 229, 255, 0.1);border-top-color:#00e5ff;animation:spin 1s linear infinite;"></div>
            <!-- Inner pulse -->
            <div style="position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle, rgba(99, 102, 241, 0.4), transparent);animation:pulse 2s ease-in-out infinite;"></div>
            <!-- Center dot -->
            <div style="position:absolute;top:50%;left:50%;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(-50%, -50%);box-shadow:0 0 15px #00e5ff;"></div>
        </div>
        <div style="font-family:'Outfit', sans-serif;font-weight:700;font-size:24px;color:#fff;letter-spacing:4px;margin-bottom:8px;">MEMOLODY</div>
        <div style="font-family:'Inter', sans-serif;font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;">Loading Core Systems...</div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
            @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
        </style>
    </div>

    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
